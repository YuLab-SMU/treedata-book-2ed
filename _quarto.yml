project:
  type: book
  output-dir: gh-pages

book:
  title: "Data Integration, Manipulation and Visualization of Phylogenetic Trees"
  author: "Guangchuang Yu"
  date: today
  description: "Master ggtree package suite to handle tree with data."
  cover-image: 9781032233574_cover_review.png
  repo-url: https://github.com/YuLab-SMU/treedata-book
  repo-actions: [edit, issue, source]
  chapters:
    - index.qmd
    - 00_author.qmd
    - part: "Part I: Tree data input, output, and manipulation"
      chapters:
        - 01_trees_and_tree_like_structures.qmd
        - 02_treeio_importing_tree.qmd
        - 03_tidytree.qmd
        - 04_treeio_exporting_tree.qmd
    - part: "Part II: Tree data visualization and annotation"
      chapters:
        - 05_ggtree_layouts.qmd
        - 06_ggtree_aesthetics.qmd
        - 07_ggtree_tree_objects.qmd
        - 08_ggtree_annotation.qmd
        - 09_ggtree_manipulation.qmd
        - 10_ggtree_tree_with_data.qmd
        - 11_ggtree_with_silhouette.qmd
        - 12_interactive_ggtree.qmd
        - 13_ggtree_exts.qmd
    - part: "Part III: ggtree extensions"
      chapters:
        - 14_ggtree_exts-others.qmd
    - part: "Part IV: Utilities and gallery"
      chapters:
        - 15_ggtree_utilities.qmd
        - 16_ggtree_gallery.qmd
    - part: "Appendix"
      chapters: 
        - A-app-faq.qmd
        - A-app-tools.qmd
        - A-app-fig-tab.qmd
    - B-references.qmd

bibliography: references.bib
csl: apa.csl

format:
  html:
    theme: cosmo
    css: css/style.css
    toc: true
    toc-depth: 3
    code-fold: false
  pdf:
    documentclass: book
    classoption: [numberinsequence, twoside]
    keep-tex: true
    include-in-header:
      text: |
        \usepackage{makeidx}
        \makeindex
    citation-method: natbib
    lot: true
    lof: true
    colorlinks: true
    link-citations: true
    fontsize: 11pt
    monofont: "Source Code Pro"
    monofontoptions: "Scale=0.7"
    geometry: "left=35mm,right=35mm,top=25mm,bottom=25mm"
